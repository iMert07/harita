<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Anatolya Birliği</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Sayfa genelinde kaydırma çubuklarını kaldırır */
            background: #eee;
        }

        .map-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden; /* SVG'den taşan her şeyi burada keser */
        }

        img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* Görselin oranını bozmadan kutuya sığdırır */
        }
    </style>
</head>
<body>

    <div class="map-container">
        <img src="Anatolya.svg" alt="Harita">
    </div>

</body>
</html>
